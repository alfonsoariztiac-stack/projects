[project]
name = "buk-people-alertas"
version = "0.1.0"
description = "Simulación funcional: ecosistema de alertas tempranas para People Happiness (caso práctico Buk)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "requests>=2.32",
    "faker>=30.0",
    "python-dateutil>=2.9",
    "google-genai>=2.21.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false
